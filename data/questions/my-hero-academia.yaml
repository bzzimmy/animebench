questions:
  - id: mha-001
    source:
      medium: anime
      cutoff: "Episode 167 — Izuku Midoriya: Rising"
      adapted_from: "Manga Chapter 423 — One For All vs. All For One"

    prompt: >-
      By the end of My Hero Academia, what personal reason is revealed to be
      behind All For One's desire to take One For All?

    answer_limit_words: 100

    reference_answer: >-
      All For One ultimately wanted One For All because it retained Yoichi,
      his younger brother, as a vestige. He wanted to reclaim and possess
      Yoichi, whom he treated as something that belonged to him. Although All
      For One called this love, his behavior revealed a controlling obsession
      rather than selfless brotherly love.

    rubric:
      required_facts:
        - One For All retained a vestige or remaining piece of Yoichi.
        - All For One wanted to reclaim, possess, or control his brother through it.
        - His professed love for Yoichi was possessive or obsessive.

      acceptable_variants:
        - Describing the motive as twisted love, fixation, or an inability to let Yoichi go.
        - Saying that All For One wanted to reunite with Yoichi, if the answer makes the possessive nature of that desire clear.

      contradictions:
        - Claiming his sole underlying motive was gaining power or defeating All Might.
        - Claiming he wanted to free Yoichi or honor Yoichi's wishes.
        - Describing his treatment of Yoichi as healthy or selfless love.

