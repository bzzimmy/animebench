  - id: mha-004
    source:
      medium: anime
      cutoff: "Episode 157 — I Am Here"
      adapted_from: "Manga Chapter 387 — Congealing"

    prompt: >-
      Did Dabi ever exhibit ice or frost abilities alongside his fire in My
      Hero Academia? Explain when and how.

    answer_limit_words: 100

    reference_answer: >-
      Yes. During the Final War, while Dabi was at the brink of death, ice
      manifested on his chest within his fiery Phosphor state. Endeavor
      recognized it as a latent element inherited from Dabi's mother, Rei, and
      the Himura side of the family. The story distinguishes this
      crisis-driven manifestation at death's door from a conventional Quirk
      Awakening.

    rubric:
      required_facts:
        - Dabi did manifest ice or frost alongside his fire.
        - The ice came from his mother Rei or the Himura side of his family.
        - It emerged during the Final War when Dabi was at the brink of death.

      acceptable_variants:
        - Describing the ice as a latent inherited ability within Dabi's Quirk.
        - Calling it a Quirk Awakening colloquially, if the near-death condition and maternal origin are otherwise clear.
        - Mentioning the ice forming on Dabi's chest or helping cool him internally.

      contradictions:
        - Claiming that Dabi never exhibited ice or frost at any point.
        - Claiming that All For One gave Dabi a separate ice Quirk.
        - Claiming that Dabi copied or stole the ability from Shoto.

