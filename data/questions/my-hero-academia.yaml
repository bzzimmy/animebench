  - id: mha-010
    source:
      medium: anime
      cutoff: "Episode 162 — The Final Boss!!"
      adapted_from: "Manga Chapter 405 — The Final Boss!!"

    prompt: >-
      How did Edgeshot keep Bakugo's body viable after his fatal injury, and
      what ultimately restarted Bakugo's heart?

    answer_limit_words: 100

    reference_answer: >-
      Edgeshot flattened his own body into thread, entered Bakugo, and used
      himself to stitch and hold together Bakugo's damaged organs and bones.
      Those repairs made survival possible but did not fully revive him. A tiny
      bead of Bakugo's explosive sweat, produced before his injury and moving
      through his bloodstream, detonated internally and jump-started his heart.

    rubric:
      required_facts:
        - Edgeshot entered Bakugo as thread and stitched or held together his damaged organs and bones.
        - Edgeshot's repairs alone did not fully return Bakugo to life.
        - A bead of Bakugo's own explosive sweat detonated internally and restarted his heart.

      acceptable_variants:
        - Referring to Edgeshot's technique as Foldabody or Thousand Sheet Pierce Zenith.
        - Describing the sweat as nitroglycerin-like or as a stored product of Explosion.
        - Saying the internal explosion resuscitated or jump-started Bakugo.

      contradictions:
        - Claiming that Edgeshot alone restored Bakugo to life without the sweat explosion.
        - Claiming that an external electrical shock restarted Bakugo's heart.
        - Claiming that Recovery Girl or another healer regenerated Bakugo's heart.

