  - id: mha-003
    source:
      medium: anime
      cutoff: "Episode 119 — Encounter, Part 2"
      adapted_from: "Manga Chapter 275 — Encounter, Part 2"

    prompt: >-
      Tomoko Shiretoko, better known as Ragdoll, lost her Quirk after the
      forest training camp. What was the Quirk, who took it, and how was it
      later used against Deku?

    answer_limit_words: 100

    reference_answer: >-
      Her Quirk was Search, which could track people and reveal their
      locations and weaknesses. All For One stole it after Ragdoll was
      kidnapped, leaving her Quirkless. It was later transferred to Tomura
      Shigaraki and retained the data Ragdoll had gathered about Deku during
      the training camp, allowing Shigaraki to locate him during the
      Paranormal Liberation War.

    rubric:
      required_facts:
        - The Quirk was Search.
        - All For One stole it from Ragdoll after she was kidnapped.
        - Tomura Shigaraki later possessed it and used Ragdoll's stored data to locate Deku.

      acceptable_variants:
        - Describing Search as tracking people's locations, weaknesses, or both.
        - Saying Search was among the stockpiled Quirks transferred to or inherited by Shigaraki.
        - Referring to the Paranormal Liberation War as the hospital raid or Shigaraki's awakening.

      contradictions:
        - Claiming that Ragdoll voluntarily gave away Search.
        - Claiming that Search was destroyed when it was taken from Ragdoll.
        - Claiming that All For One used Search only to remove Ragdoll from the battle.

