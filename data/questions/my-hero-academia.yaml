  - id: mha-006
    source:
      medium: anime
      cutoff: "Episode 134 — The Lovely Lady Nagant"
      adapted_from: "Manga Chapter 314 — The Lovely Lady Nagant"

    prompt: >-
      Why was Lady Nagant actually sent to Tartarus, and what explanation was
      given to the public?

    answer_limit_words: 100

    reference_answer: >-
      After years of performing secret assassinations for the Hero Public
      Safety Commission, Lady Nagant became disillusioned and resisted another
      assignment. When the Commission president threatened her for trying to
      walk away, she killed him. The Commission concealed the truth and told
      the public that she had murdered another hero following a dispute.

    rubric:
      required_facts:
        - Lady Nagant killed the president or chairman of the Hero Public Safety Commission.
        - She acted after years as the Commission's secret assassin and after being threatened when she resisted or tried to leave.
        - The public was falsely told that she had killed a fellow hero, commonly described as occurring after a dispute.

      acceptable_variants:
        - Referring to the victim as the Commission president, chairman, leader, or superior.
        - Describing Nagant as disillusioned by the Commission's extrajudicial killings and cover-ups.
        - Saying the Commission fabricated or concealed the circumstances of the killing.

      contradictions:
        - Claiming that Nagant was imprisoned merely for carrying out the Commission's sanctioned assassinations.
        - Claiming that the person she actually killed was an unrelated Pro Hero rather than the Commission president.
        - Claiming that the Commission publicly admitted its use of Nagant as an assassin.

