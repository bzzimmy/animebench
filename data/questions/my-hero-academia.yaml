      What was Kurogiri's original identity, and how was that person's Quirk
      used to create Warp Gate?

    answer_limit_words: 100

    reference_answer: >-
      Kurogiri was created from the corpse of Oboro Shirakumo, Aizawa and
      Present Mic's friend from U.A. Doctor Garaki and All For One converted
      his body into a Nomu. Kurogiri's Warp Gate is an artificial composite of
      multiple Quirk factors built with Oboro's Cloud Quirk as its base.

    rubric:
      required_facts:
        - Kurogiri's original body and identity belonged to Oboro Shirakumo.
        - Oboro was Aizawa and Present Mic's deceased U.A. classmate whose corpse was made into a Nomu.
        - Oboro's Cloud Quirk formed the base of the artificial composite Quirk Warp Gate.

      acceptable_variants:
        - Crediting Doctor Kyudai Garaki, All For One, or both with creating Kurogiri.
        - Referring to Present Mic by his real name, Hizashi Yamada.
        - Saying multiple Quirks or Quirk factors were fused with Cloud to produce Warp Gate.

      contradictions:
        - Claiming that Oboro willingly became Kurogiri.
        - Claiming that Warp Gate was Oboro's original Quirk without modification.
        - Claiming that Kurogiri merely copied Oboro while using an unrelated body.

