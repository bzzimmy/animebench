  - id: mha-009
    source:
      medium: anime
      cutoff: "Episode 166 — From Aizawa"
      adapted_from: "Manga Chapter 419 — Design"

    prompt: >-
      What was the true origin of Tenko Shimura's Decay, and what capability
      had been removed from the Quirk it was derived from?

    answer_limit_words: 100

    reference_answer: >-
      Decay was not Tenko's natural Quirk. All For One stole Tenko's original,
      still-undeveloped Quirk factor and later secretly gave him Decay. Doctor
      Garaki created Decay from a modified duplicate of Kai Chisaki's Overhaul,
      removing its ability to restore or reassemble what it destroyed and
      leaving only its destructive side.

    rubric:
      required_facts:
        - All For One stole Tenko's original Quirk factor and later gave him Decay.
        - Decay was derived from a modified copy of Kai Chisaki's Overhaul.
        - Overhaul's restoration or reassembly capability was removed, leaving Decay purely destructive.

      acceptable_variants:
        - Crediting Doctor Garaki with copying and modifying Overhaul.
        - Describing the removed capability as reconstruction, restoration, repair, or reversal.
        - Mentioning that All For One transferred Decay while walking the young Tenko home.

      contradictions:
        - Claiming that Decay was Tenko's natural mutation.
        - Claiming that Kai Chisaki personally transferred Overhaul to Tenko.
        - Claiming that Decay retained Overhaul's ability to reconstruct what it destroyed.

