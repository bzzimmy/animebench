  - id: mha-007
    source:
      medium: anime
      cutoff: "Episode 131 — Izuku Midoriya and Tomura Shigaraki"
      adapted_from: "Manga Chapter 304 — Izuku Midoriya and Toshinori Yagi"

    prompt: >-
      Why did One For All shorten Hikage Shinomori's lifespan while All Might
      could carry it for decades without suffering the same effect?

    answer_limit_words: 100

    reference_answer: >-
      Hikage already possessed Danger Sense when he inherited One For All. As
      One For All accumulated power, adding it to an existing Quirk overloaded
      his body's capacity and accelerated his aging, causing him to die at
      forty. All Might was born Quirkless, so his body acted as an empty vessel
      that could contain One For All without the same lifespan cost.

    rubric:
      required_facts:
        - Hikage already had Danger Sense when he inherited One For All.
        - Holding One For All alongside an existing Quirk overloaded his body and shortened his lifespan.
        - All Might was Quirkless, making him an empty vessel able to carry One For All without accelerated aging.

      acceptable_variants:
        - Describing Hikage's death at forty as accelerated aging or dying of old age.
        - Explaining the overload with the vessel or overflowing-cup analogy used in the story.
        - Mentioning that Deku was also a suitable vessel because he was born Quirkless.

      contradictions:
        - Claiming that Hikage died from a battle injury or from All For One attacking him.
        - Claiming that Danger Sense alone naturally shortened Hikage's lifespan.
        - Claiming that All Might avoided the effect because of his muscular physique or superior technique.

