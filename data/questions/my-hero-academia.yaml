  - id: mha-002
    source:
      medium: anime
      cutoff: "Episode 140 — Specter"
      adapted_from: "Manga Chapters 333–334"

    prompt: >-
      Why did New Order ultimately disappear after being stolen from Star and
      Stripe?

    answer_limit_words: 100

    reference_answer: >-
      Immediately before New Order was stolen, Star and Stripe imposed a final
      rule that New Order would revolt against other Quirks. Inside Shigaraki,
      it attacked the stockpiled Quirks, but those Quirks also fought back.
      Because New Order was itself a Quirk, it was destroyed during this
      conflict after taking several of them with it.

    rubric:
      required_facts:
        - Star and Stripe ordered New Order to revolt against other Quirks before it was stolen.
        - New Order attacked the stockpiled Quirks inside Shigaraki.
        - Those Quirks destroyed New Order because it was itself a Quirk.

      acceptable_variants:
        - Describing the event as New Order and the stolen Quirks destroying one another.
        - Referring to Star and Stripe's vestige as the force attacking the other Quirks.

      contradictions:
        - Claiming that Shigaraki or All For One failed to steal New Order.
        - Claiming that New Order disappeared solely because Star and Stripe died.
        - Claiming that New Order was successfully transferred to another person.

