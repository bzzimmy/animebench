  - id: mha-005
    source:
      medium: anime
      cutoff: "Episode 141 — Villain"
      adapted_from: "Manga Chapter 336 — Villain"

    prompt: >-
      Which Class 1-A student secretly passed U.A. information to All For One,
      and what prior arrangement allowed All For One to coerce the student's
      family?

    answer_limit_words: 100

    reference_answer: >-
      The student was Yuga Aoyama. He was born Quirkless, so his parents
      approached All For One, who gave him Navel Laser. All For One later used
      that arrangement and threats against the family to force Aoyama to pass
      him information about U.A., including information concerning the U.S.J.
      and forest training camp. Aoyama acted under coercion rather than out of
      loyalty to the villains.

    rubric:
      required_facts:
        - The student was Yuga Aoyama.
        - Aoyama was born Quirkless and received Navel Laser from All For One after his parents sought help.
        - All For One used the arrangement and threats against Aoyama's family to coerce him into providing information.

      acceptable_variants:
        - Referring to Aoyama as Can't Stop Twinkling.
        - Mentioning the U.S.J. incident, forest training camp, or both as information he provided.
        - Describing Aoyama as an unwilling spy, mole, or traitor.

      contradictions:
        - Identifying Toru Hagakure or another student as the actual traitor.
        - Claiming that Aoyama naturally inherited Navel Laser.
        - Claiming that Aoyama willingly supported All For One's goals without coercion.

